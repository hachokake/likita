{% extends 'base.html' %}
{% load static %}

{% block title %}Inscription | Likita{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl">
    <div class="glass-card p-8 sm:p-10">
        <div class="mb-4 flex items-start justify-start">
            <img src="{% static 'media/branding/logo2.svg' %}" alt="Likita" style="width: 48px; height: 48px;" class="object-contain">
        </div>
        <p class="text-xs uppercase tracking-[0.3em] text-white/40">Creation de compte</p>
        <h1 class="mt-3 text-4xl font-semibold">Creer votre espace organisateur</h1>
        <form method="post" class="mt-8 grid gap-5 sm:grid-cols-2">
            {% csrf_token %}
            {% for field in form %}
                <div class="space-y-2 {% if field.name == 'password1' or field.name == 'password2' %}sm:col-span-2{% endif %}">
                    <label class="text-sm text-white/60">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit" class="btn-primary sm:col-span-2">Ouvrir mon compte</button>
        </form>
    </div>
</section>
{% endblock %}
