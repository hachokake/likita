{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Invitation{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261016-2">
    <style>
        body {
            margin: 0;
            background: #f7f2ed;
            color: #302626;
            font-family: "Sora", sans-serif;
        }

        .invitation-page .font-serif {
            font-family: "Cormorant Garamond", Georgia, serif;
        }

        .invitation-pass-shell {
            margin: 0 auto 3rem;
            max-width: 64rem;
        }

        .invitation-pass {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 13rem;
            min-height: 25rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.75rem;
            background: #3f292e;
            box-shadow: 0 2rem 5rem rgba(62, 36, 35, 0.22);
            color: #fff;
            isolation: isolate;
        }

        .invitation-pass__cover,
        .invitation-pass__veil {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .invitation-pass__cover {
            z-index: -3;
            object-fit: cover;
        }

        .invitation-pass__fallback {
            position: absolute;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(circle at 12% 18%, rgba(226, 185, 160, 0.3), transparent 28%),
                linear-gradient(135deg, #8b6268, #4b3036 58%, #21171a);
        }

        .invitation-pass__veil {
            z-index: -2;
            background:
                linear-gradient(90deg, rgba(24, 14, 17, 0.88) 0%, rgba(24, 14, 17, 0.68) 58%, rgba(24, 14, 17, 0.82) 100%),
                linear-gradient(0deg, rgba(24, 14, 17, 0.45), transparent 55%);
        }

        .invitation-pass__content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            padding: 2.75rem;
        }

        .invitation-pass__eyebrow {
            margin: 0;
            color: #efd4c3;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .invitation-pass__event {
            max-width: 37rem;
            margin: 1.1rem 0 0;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: clamp(2.8rem, 6vw, 5rem);
            font-weight: 600;
            line-height: 0.92;
            letter-spacing: -0.03em;
        }

        .invitation-pass__guest-label {
            margin: 2.5rem 0 0.35rem;
            color: rgba(255, 255, 255, 0.68);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .invitation-pass__guest {
            margin: 0;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: clamp(1.8rem, 3.5vw, 2.7rem);
            font-weight: 600;
            line-height: 1;
        }

        .invitation-pass__details {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem 1.5rem;
            margin-top: 1.7rem;
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.78rem;
        }

        .invitation-pass__details span {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .invitation-pass__details span::before {
            width: 0.3rem;
            height: 0.3rem;
            border-radius: 999px;
            background: #dcae96;
            content: "";
        }

        .invitation-pass__qr-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 1.5rem 1.5rem 1.5rem 0;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 1.25rem;
            background: rgba(255, 255, 255, 0.1);
            text-align: center;
            backdrop-filter: blur(0.75rem);
        }

        .invitation-pass__qr-frame {
            width: 9.25rem;
            padding: 0.6rem;
            border-radius: 0.85rem;
            background: #fff;
            box-shadow: 0 0.8rem 2rem rgba(20, 10, 13, 0.25);
        }

        .invitation-pass__qr-frame img {
            display: block;
            width: 100%;
            height: auto;
        }

        .invitation-pass__scan {
            margin: 1rem 0 0;
            font-size: 0.63rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .invitation-pass__code {
            margin: 0.45rem 0 0;
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.6rem;
        }

        .invitation-pass-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .invitation-pass-print {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            border: 0;
            border-radius: 999px;
            background: #70454e;
            padding: 0.85rem 1.3rem;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            box-shadow: 0 0.7rem 1.5rem rgba(112, 69, 78, 0.18);
        }

        .invitation-pass-print:hover {
            background: #59363e;
        }

        @media (max-width: 700px) {
            .invitation-pass {
                grid-template-columns: 1fr;
            }

            .invitation-pass__content {
                padding: 2rem 1.6rem 1rem;
                text-align: center;
            }

            .invitation-pass__details {
                justify-content: center;
            }

            .invitation-pass__qr-column {
                margin: 1rem 1.5rem 1.5rem;
            }
        }

        @media print {
            @page {
                size: 160mm 91mm;
                margin: 0;
            }

            html,
            body {
                width: 160mm;
                height: 91mm;
                margin: 0 !important;
                padding: 0 !important;
                background: #3f292e;
            }

            .invitation-page > div > :not(.invitation-pass-shell),
            .invitation-pass-actions {
                display: none !important;
            }

            .invitation-page {
                width: 160mm;
                height: 91mm;
                min-height: 0 !important;
                padding: 0 !important;
            }

            .invitation-page > div,
            .invitation-pass-shell {
                width: 160mm;
                height: 91mm;
                max-width: none;
                margin: 0;
            }

            .invitation-pass {
                box-sizing: border-box;
                width: 160mm;
                height: 91mm;
                min-height: 0;
                border-radius: 0;
                box-shadow: none;
                break-inside: avoid;
                page-break-inside: avoid;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
