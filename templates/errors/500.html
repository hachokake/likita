<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Indisponible temporairement | Likita</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #fff7ed; color: #1f2937; font-family: Georgia, serif; }
        main { width: min(100%, 42rem); border-left: 8px solid #e11d48; padding: 2rem; background: #ffffff; box-shadow: 0 18px 50px rgba(69, 10, 10, 0.12); }
        .code { margin: 0; color: #e11d48; font: 700 1rem/1.2 monospace; letter-spacing: 0.08em; }
        h1 { margin: 0.5rem 0 1rem; font-size: clamp(2rem, 6vw, 4rem); line-height: 1; }
        p { max-width: 36rem; font: 1.05rem/1.65 system-ui, sans-serif; }
        a { display: inline-block; margin-top: 0.75rem; padding: 0.8rem 1.1rem; background: #e11d48; color: #fff; font: 700 0.95rem/1 system-ui, sans-serif; text-decoration: none; }
        a:hover, a:focus { background: #be123c; }
    </style>
</head>
<body>
    <main>
        <p class="code">ERREUR 500</p>
        <h1>Un incident temporaire est survenu.</h1>
        <p>Revenez a l'accueil et reessayez dans quelques instants. Notre equipe peut consulter les journaux techniques pour corriger le probleme.</p>
        <a href="/">Retour a l accueil</a>
    </main>
</body>
</html>
