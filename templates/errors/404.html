<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page introuvable | Likita</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: radial-gradient(circle at 80% 0%, rgba(197, 29, 50, 0.22), transparent 45%), linear-gradient(180deg, #15191a, #101314); color: #f4f6f7; font-family: "Space Grotesk", system-ui, sans-serif; }
        main { width: min(100%, 34rem); text-align: center; }
        .code { margin: 0; color: #fda4af; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; }
        h1 { margin: 1rem 0 0.75rem; font-family: "Sora", sans-serif; font-size: clamp(1.9rem, 5vw, 2.75rem); line-height: 1.1; letter-spacing: -0.02em; }
        p { margin: 0 auto; max-width: 28rem; color: rgba(244, 246, 247, 0.65); line-height: 1.65; }
        a { display: inline-flex; margin-top: 1.75rem; padding: 0.85rem 1.4rem; border-radius: 8px; background: #c51d32; color: #fff; font-weight: 600; text-decoration: none; transition: background 160ms ease; }
        a:hover, a:focus { background: #e2334a; }
    </style>
</head>
<body>
    <main>
        <p class="code">Erreur 404</p>
        <h1>Cette page est introuvable.</h1>
        <p>L'adresse est peut-être incorrecte ou la page n'existe plus. Si vous avez suivi un lien d'invitation, vérifiez qu'il est complet.</p>
        <a href="/">Retour a l accueil</a>
    </main>
</body>
</html>
